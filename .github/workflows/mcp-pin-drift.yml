name: MCP Pin Drift

# The manifest-consistency job in publish-clawhub.yml proves every pin in this
# repo agrees with itself — it cannot notice that npm has moved on. That gap is
# real: 0.17.0 shipped on 2026-08-21 and this repo sat on 0.16.1 for over a
# week until a human happened to look at the ClawHub page.
#
# This job compares the pinned version against the npm dist-tag once a week and
# opens (or refreshes) an issue when they differ. It deliberately does NOT open
# a PR: a bump here must travel together with the OpenClaw plugin pin in
# rotifer-playground (the two are documented as locked to each other), and the
# ClawHub republish is a human-approved tag push — an auto-PR would make the
# easy half of the job look like the whole job.

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  drift:
    name: Pinned vs npm latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Compare
        id: compare
        run: |
          PINNED="$(python3 -c "
          import json, re
          args = json.load(open('clawhub.json')).get('mcp_server', {}).get('args', [])
          m = [re.search(r'@rotifer/mcp-server@([0-9.]+)', a) for a in args]
          print(next(x.group(1) for x in m if x))
          ")"
          LATEST="$(npm view @rotifer/mcp-server version)"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "  pinned: $PINNED"
          echo "  latest: $LATEST"
          if [ "$PINNED" = "$LATEST" ]; then
            echo "in_sync=true" >> "$GITHUB_OUTPUT"
            echo "✅ in sync"
          else
            echo "in_sync=false" >> "$GITHUB_OUTPUT"
            echo "::warning::pinned $PINNED but npm latest is $LATEST"
          fi

      # One standing issue, refreshed in place — a weekly duplicate per drift
      # week would train everyone to ignore the label.
      - name: Open or refresh the drift issue
        if: steps.compare.outputs.in_sync == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.compare.outputs.pinned }}
          LATEST: ${{ steps.compare.outputs.latest }}
        run: |
          TITLE="MCP server pin has drifted behind npm"
          BODY="$(cat <<TXT
          \`clawhub.json\` (and every pin the manifest-consistency gate keeps in
          agreement with it) launches \`@rotifer/mcp-server@${PINNED}\`, but npm
          latest is \`${LATEST}\`.

          Bumping means, together and in this order:
          1. the OpenClaw plugin pins in \`rotifer-playground/plugins/rotifer/\` (the two repos are locked to the same version)
          2. every runtime pin here — historical references written as bare \`x.y.z\` stay as they are
          3. \`clawhub.json\` + SKILL.md frontmatter version bump, then a \`clawhub-v*\` tag to republish

          Refreshed automatically by \`.github/workflows/mcp-pin-drift.yml\`.
          TXT
          )"
          EXISTING="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number // empty')"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still drifted: pinned \`$PINNED\`, npm latest \`$LATEST\` ($(date -u +%F))."
            echo "refreshed issue #$EXISTING"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
